<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <title>Island Link</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <main>
    <div class="landing">
      <header>
        <p class="brand">Island Link</p>
      </header>
      <section aria-labelledby="page-heading">
        <h1 id="page-heading">Find a ride. Fill a seat.</h1>
        <p class="intro">Connect with nearby passengers or drivers.</p>
        <div class="roles">
          <article class="role-card">
            <span class="role-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="7" r="3"></circle>
                <path d="M5.5 20v-1.5a6.5 6.5 0 0 1 13 0V20"></path>
                <path d="M8.5 14.5 12 17l3.5-2.5"></path>
              </svg>
            </span>
            <h2>Passenger</h2>
            <p class="role-description">Find a nearby tricycle for your trip.</p>
            <a class="role-link" href="customer/index.html">Continue as Passenger</a>
          </article>
          <article class="role-card">
            <span class="role-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="9" cy="23" r="3"></circle>
                <circle cx="24" cy="23" r="3"></circle>
                <path d="M6 23H4v-5h11l4 5"></path>
                <path d="M11 18v-5h8l4 5h5v5h-1"></path>
                <path d="M19 13v-3h5l2 3"></path>
                <path d="M15 18h4"></path>
              </svg>
            </span>
            <h2>Driver</h2>
            <p class="role-description">Find nearby passengers heading your way.</p>
            <a class="role-link" href="rider/index.html">Continue as Driver</a>
          </article>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
